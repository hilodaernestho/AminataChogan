  .bar input{flex:1 1 100%}
  .bar select{flex:1 1 140px}
  .bar input:focus-visible,.bar select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  #count{flex:1 1 100%;color:var(--muted);font-size:.85rem}
  main{max-width:1100px;margin:0 auto;padding-block:18px 6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px 12px;box-shadow:var(--shadow);position:relative;min-width:0}
  .num{position:absolute;top:-10px;left:12px;background:var(--accent2);color:var(--bg);font-weight:800;border-radius:8px;padding:2px 10px;font-size:.95rem;font-variant-numeric:tabular-nums}
  .card h2{margin:6px 0 0;font-size:1.1rem;color:var(--accent);overflow-wrap:anywhere}

  table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
  td{padding:6px 4px;border-top:1px solid var(--line)}
  td.code{font-family:ui-monospace,Menlo,monospace;color:var(--muted)}

<header>
  <h1>Aminata DIAME Chogan</h1>
  <p>Liste parfum : tape un nom, une marque ou un numéro</p>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Ex : 118, sauvage, tom ford, T045…" autocomplete="off">
  <select id="brand" aria-label="Marque"><option value="">Toutes les marques</option></select>
  <select id="sort" aria-label="Tri">
    <option value="num">Tri : numéro</option>
    <option value="name">Tri : nom A→Z</option>
    <option value="price">Tri : prix croissant</option>
  </select>
  <div id="count"></div>
</div>
<main id="list"></main>
<footer>Catalogue recopié depuis les images. Les codes sont ceux imprimés : en cas de doute, vérifie avec la vendeuse.</footer>

const GENDER = {W:"Femme",M:"Homme",U:"Mixte"};
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const euro = n => n.toFixed(2).replace(".",",")+" €";

const items = DATA.map(r=>{
  const [num,name,brand,tier,...codes]=r;
  const sizes = TIERS[tier].map((s,i)=>({size:s[0],price:s[1],code:codes[i]}));
  const letter = /[WMU]$/.test(num) ? num.slice(-1) : "";
  const n = parseInt(num,10);
  return {num,n,name,brand,sizes,gender:GENDER[letter]||"",
    min:Math.min(...sizes.map(s=>s.price)),
    hay:norm([num,name,brand,GENDER[letter]||"",...codes].join(" "))};
});

const list=document.getElementById("list"),q=document.getElementById("q"),
      brandSel=document.getElementById("brand"),sortSel=document.getElementById("sort"),
      count=document.getElementById("count");

[...new Set(items.map(i=>i.brand))].sort((a,b)=>a.localeCompare(b,"fr")).forEach(b=>{
  const o=document.createElement("option");o.value=b;o.textContent=b;brandSel.appendChild(o);
});

const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const tokens = norm(q.value.trim()).split(/\s+/).filter(Boolean);
  let res = items.filter(i =>
    (!brandSel.value || i.brand===brandSel.value) &&
    tokens.every(t=>i.hay.includes(t)));
  const s = sortSel.value;
  res.sort((a,b)=> s==="name" ? a.name.localeCompare(b.name,"fr")||a.n-b.n
                  : s==="price" ? a.min-b.min||a.n-b.n : a.n-b.n);
  count.textContent = res.length+" parfum"+(res.length>1?"s":"")+" trouvé"+(res.length>1?"s":"");
  list.innerHTML = res.length ? res.map(i=>`
    <article class="card">
      <div class="num">${esc(i.num)}</div>
      <h2>${esc(i.name)}${i.gender?`<span class="gender">${i.gender}</span>`:""}</h2>

      <table>${i.sizes.map(z=>`<tr><td>${z.size}</td><td class="code">${esc(z.code)}</td><td class="price">${euro(z.price)}</td></tr>`).join("")}</table>

}
[q,brandSel,sortSel].forEach(e=>e.addEventListener("input",render));
render();
